; Plane Crazy patch settings. Set a key to 0 to turn that fix off.

[General]
Enabled=1

[Sound]
; Stops the sound device list at the 16 entries the game has room for. Without it the game
; crashes at startup on PCs with 16 or more audio playback devices.
LimitDevices=1

[Saves]
; Keep custom planes, ghosts and high scores in %USERPROFILE%\Saved Games\Inner Workings\Plane Crazy
; instead of the game folder. Existing ones are copied over on the first start.
Redirect=1
; Use this folder instead (empty = the Saved Games folder above)
Folder=

[Registry]
; Keep the game's settings in Settings.ini in the saves folder instead of the registry.
UseSettingsFile=1
; On the first start, copy settings an earlier install left in the registry.
Import=1

[Player]
; Default pilot name for new planes (the game took it from the registered owner of Windows).
; Empty = your Windows user name.
Name=

[Gamepad]
; Modern controllers through SDL 2 (XInput, PlayStation, Switch...), with hotplug and rumble.
; Left stick/D-pad steer, RT accelerates, LT brakes, A fires powerups (menu select), B fires the cannon (menu back),
; X air brakes, Y cockpit view, Start opens the in-flight menu. A wheel or joystick still works when no gamepad is attached.
UseSDL=1
; Left stick dead zone in percent (the game itself asks for 15)
Deadzone=15
; Rumble strength in percent (0 = off; the game's force feedback option applies too)
Rumble=100
; 1 = invert the stick's up/down
InvertY=0
; Button for the cockpit/chase view toggle (4 = Y), when gamepad.map doesn't set one
CockpitViewButton=4
; 1 = Start opens/closes the in-flight menu during a race (like Esc)
StartOpensMenu=1

[Widescreen]
; Pick the resolution in the setup (Configure.bat / pcrazy.exe -s). On wide screens:
; keep the 4:3 vertical view and see more at the sides (the game cut off the top and bottom instead)
HorPlusFov=1
; draw the HUD and all text at 4:3 in the middle of the screen instead of stretched
Center2D=1

[Players]
; Players per network game, 8..16 (the original is 8). Everyone in a game needs the patch and the same value.
MaxPlayers=16

[Display]
; Resolution and Colour Depth in the game's Options menu. A new resolution takes effect at the next race
; (or when you go back to the menus); colour depth at the next start. They are kept in Settings.ini [Display].
; 32-bit colour removes the banding of 16-bit rendering (hardware renderer only).
MenuOptions=1

[Network]
; Network games over TCP/IP without "-m" or the protocol dialog. "Network Game" in the main menu lists the
; games found on the network (LAN broadcast); join one or host your own.
Enable=1
; Look for games on this computer only (IP address or name) instead of the whole LAN. Only that computer's
; games can be seen, so course sessions must then be hosted there too.
Host=
; Name of the games you host (empty = "<pilot>'s game"). Players in different games don't see each other's races.
GameName=
; 0 = keep the original single network-wide lobby (still TCP/IP, no dialog)
Browser=1

[Framerate]
; Frame Rate Limit and Vertical Sync in the game's Options menu (kept in Settings.ini [Display] MaxFPS / VSync;
; the two keys below are only the defaults). The game runs at the same speed at any frame rate.
MenuOptions=1
; Frame rate limit (0 = none: with vertical sync on, the game runs at the display's refresh rate)
MaxFPS=0
; 1 = wait for the display's refresh (no tearing); 0 = as fast as the limit allows
VSync=1
; Fullscreen refresh rate in Hz. 0 = the highest the display offers at the chosen resolution (high refresh rate
; monitors: 120, 144, 240 Hz...); -1 = leave it to Windows (usually 60 Hz, the original behaviour)
RefreshRate=0
